<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./register.css">
</head>
<body>
    <div class="box1">
        <div class="container1">
            <h2>Register form</h2>
            <div class="input-group">
                <label for="name">Username</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>
            <div class="input-group">
                <label for="mail">Email</label>
                <input type="email" id="mail" name="mail" placeholder="Enter your mail ID" required>
            </div>
            <div class="input-group">
                <label for="number">phone number</label>
                <input type="tel" id="number" name="number" placeholder="Enter your phone number" required>
            </div>
            <div class="input-group">
                <label for="password">password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button class="btn"><a href="./login.html">Register</a></button>
            <div class="register">
                <p> Do you have an account? <a href="./login.html">Login here</a></p>
            </div>
        </div>

    </div>
</body>
</html>
